.ac{width:min(380px,100%)}.ac h1{font-size:26px;font-weight:600;letter-spacing:.03em;margin:0}.ac .m{margin:4px 0 18px;font-size:13px}
.ac input{display:block;width:100%;padding:12px;border:1px solid var(--ln);border-radius:8px;background:var(--sf);font-size:15px;margin-top:10px}

.card b{font-size:16px;font-weight:600}.card .act{margin-top:10px}
.pill{display:inline-block;border:1px solid var(--ln);border-radius:99px;padding:1px 9px;font-size:11px;color:var(--mu);margin-left:6px}
.sel{width:auto!important;display:inline-block!important;padding:5px 8px!important;font-size:13px!important;margin:0!important}
</style></head><body>
<div class="app"><div class="top tl"><img id="lg" alt="" style="display:none"><div><b>ZUI SYSTEM</b><small id="cn">Satu login untuk semua aplikasi Zui</small></div></div>

<input id="ae" type="email" required autocomplete="email" placeholder="Email" aria-label="Email"><input id="ap" type="password" required minlength="8" autocomplete="current-password" placeholder="Kata sandi (min. 8 karakter)" aria-label="Kata sandi">

<script>
const $=s=>document.querySelector(s),E=s=>String(s).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const CFG={apiKey:'AIzaSyAR-TIaq1VH0OOD2XGx_IhedaH7mwKpW30',authDomain:'zuisystem.firebaseapp.com',projectId:'zuisystem',storageBucket:'zuisystem.firebasestorage.app',messagingSenderId:'55666230248',appId:'1:55666230248:web:783df0dc060a1d7ce3da5d'};
const RL={pemilik:'Pemilik',admin:'Admin',gudang:'Gudang',produksi:'Produksi',mutu:'Mutu',kasir:'Kasir',keuangan:'Keuangan'},RS=['admin','gudang','produksi','mutu','kasir','keuangan'];
const N=['Aplikasi','Anggota','Aktivitas','Pengaturan'],LN=N.length-1;
const APPS=[['inventori','Zui Inventori','Stok, pembelian, penjualan, batch dan kedaluwarsa','pemilik admin gudang produksi mutu kasir keuangan'],['manufaktur','Zui Manufaktur','BoM, produksi, mutu','pemilik admin gudang produksi mutu'],['karyawan','Zui Karyawan','Data karyawan, absen, cuti','pemilik admin gudang produksi mutu kasir keuangan'],['keuangan','Zui Keuangan','Utang, piutang, kas','pemilik admin keuangan']];
const uid=()=>Date.now().toString(36)+Math.random().toString(36).slice(2,7),fdt=t=>{try{return new Date(t).toLocaleString('id-ID',{day:'numeric',month:'short',hour:'2-digit',minute:'2-digit'})}catch(e){return''}};
let TGS=[],TGL=false,USER=null,FA=null,FS=null,CID=null,ME={uid:'',email:'',nama:'',peran:''},CO={nama:'',apps:{}},MEM=[],INV=[],LOGS=[],LQ='',DEL='',cur=0,AM='in';
const isAdm=()=>ME.peran==='pemilik'||ME.peran==='admin',canLog=()=>isAdm()||ME.peran==='keuangan';
function toast(m){const e=$('#ts');e.textContent=m;e.classList.add('on');clearTimeout(toast.t);toast.t=setTimeout(()=>e.classList.remove('on'),3500)}
function msg(t,e){const m=$('#am');m.textContent=t;m.className='am'+(e?' er':'')}
function fbe(e){const m={'auth/invalid-credential':'Email atau kata sandi salah','auth/wrong-password':'Email atau kata sandi salah','auth/user-not-found':'Email atau kata sandi salah','auth/email-already-in-use':'Email sudah terdaftar','auth/weak-password':'Kata sandi terlalu lemah','auth/invalid-email':'Format email tidak valid','auth/too-many-requests':'Terlalu banyak percobaan. Coba lagi nanti','auth/network-request-failed':'Tidak ada koneksi internet','auth/popup-blocked':'Popup login diblokir peramban','auth/unauthorized-domain':'Domain belum diizinkan di Firebase (Authorized domains)','auth/account-exists-with-different-credential':'Email ini sudah terdaftar dengan metode lain','auth/operation-not-allowed':'Metode login ini belum diaktifkan di Firebase','permission-denied':'Akses ditolak. Periksa peran Anda dan Firestore Rules'};return m[e&&e.code]||(e&&e.message)||'Terjadi kesalahan'}
const coRef=()=>FS.collection('perusahaan').doc(CID);
async function logw(aksi,ket){try{await coRef().collection('log').doc(uid()).set({uid:ME.uid,nama:ME.nama,app:'system',aksi,ket:String(ket||'').slice(0,200),ts:Date.now()})}catch(e){}}
function ap(){const t=localStorage.getItem('zui.sys.th')||'auto',e=document.documentElement;if(t==='auto')e.removeAttribute('data-app');else e.setAttribute('data-app',t)}
function th(i){try{localStorage.setItem('zui.sys.th',['auto','light','dark'][i])}catch(e){}ap();rSet()}
const chips=(L,c,f)=>'<div class="sgs">'+L.map((n,i)=>`<button class="sg${i==c?' on':''}" onclick="${f}(${i})">${n}</button>`).join('')+'</div>';
const okUrl=u=>/^https?:\/\//i.test(u||'');
/* ---------- render ---------- */
const APN=Object.fromEntries(APPS.map(a=>[a[0],a[1]]));
const tgl2=t=>{const u=(CO.apps||{})[t.app];return`<div class="it"><div class="row"><div class="tx"><div class="nm" style="font-size:14px">${E(t.t)}</div><div class="m">${E(APN[t.app]||'')}</div></div><div class="q"><b>${t.n}</b>${okUrl(u)?`<br><a class="ab" href="${E(u)}" target="_blank" rel="noopener">Buka</a>`:''}</div></div></div>`};
function rApp(){const al=APPS.filter(a=>a[3].split(' ').includes(ME.peran));
$('#p_app').innerHTML=`<p class="sum">${E(CO.nama)}</p><div class="m">Masuk sebagai ${E(ME.nama)} <span class="pill">${E(RL[ME.peran]||'-')}</span></div>`+(CO.alur===false?'':'<h3 class="hh">Menunggu tindakan Anda</h3>'+(TGS.length?TGS.map(tgl2).join(''):`<div class="em">${TGL?'Tidak ada yang menunggu. Semua beres.':'Memeriksa…'}</div>`)+`<div class="act"><button class="bt" onclick="ldTugas()">Periksa lagi</button></div>`)+al.map(a=>{const u=(CO.apps||{})[a[0]];return`<div class="card"><b>${E(a[1])}</b><div class="m">${E(a[2])}</div><div class="act">${okUrl(u)?`<a class="ab" href="${E(u)}" target="_blank" rel="noopener">Buka</a>`:`<span class="m">${a[0]==='inventori'||isAdm()?'Alamat aplikasi belum diisi'+(isAdm()?'. Isi di Pengaturan.':'. Hubungi admin.'):'Belum tersedia'}</span>`}</div></div>`}).join('')}
function rMem(){let h=`<p class="sum">${MEM.length} anggota</p>`;
if(isAdm()){h+=`<h3 class="hh">Undang anggota</h3><input class="ni" id="ie" type="email" placeholder="Email yang akan diundang" aria-label="Email undangan"><input class="ni" id="in" placeholder="Nama (opsional)" maxlength="60" aria-label="Nama"><select class="ni" id="ip" aria-label="Peran">${RS.map(r=>`<option value="${r}">${RL[r]}</option>`).join('')}</select><button class="go" style="margin-top:10px;padding:10px 16px;border-radius:8px" onclick="invite()">Kirim undangan</button><p class="m">Orang yang diundang masuk atau mendaftar dengan email ini di aplikasi Zui mana pun, lalu otomatis bergabung. Satu akun hanya bisa tergabung di satu perusahaan.</p>`;
if(INV.length)h+='<h3 class="hh">Undangan menunggu</h3>'+INV.map(v=>`<div class="it"><div class="row"><div class="tx"><div class="nm">${E(v.id)}</div><div class="m">${E(RL[v.peran]||v.peran)}${v.nama?' · '+E(v.nama):''}</div></div><button class="bt" id="xi${E(v.id)}" onclick="cinv('${E(v.id)}')">Batalkan</button></div></div>`).join('')}
h+='<h3 class="hh">Daftar anggota</h3>'+MEM.map(m=>{const edit=isAdm()&&m.peran!=='pemilik'&&m.id!==ME.uid;return`<div class="it"><div class="row"><div class="tx"><div class="nm">${E(m.nama||m.email)}${m.id===ME.uid?' <span class="pill">Anda</span>':''}${m.aktif?'':' <span class="pill">nonaktif</span>'}</div><div class="m">${E(m.email)}</div></div>${edit?`<select class="ni sel" aria-label="Peran" onchange="spr('${m.id}',this.value)">${RS.map(r=>`<option value="${r}"${m.peran===r?' selected':''}>${RL[r]}</option>`).join('')}</select>`:`<span class="pill">${E(RL[m.peran]||m.peran)}</span>`}</div>${edit?`<div class="act"><button onclick="tgl('${m.id}')">${m.aktif?'Nonaktifkan':'Aktifkan'}</button><button id="xm${m.id}" onclick="rm('${m.id}')">Keluarkan</button></div>`:''}</div>`}).join('');
$('#p_mem').innerHTML=h}
function rLog(){if(!canLog()){$('#p_log').innerHTML='<div class="em">Jejak aktivitas hanya untuk Pemilik, Admin, dan Keuangan.</div>';return}
const q=LQ.toLowerCase(),L=LOGS.filter(l=>!q||[l.nama,l.app,l.aksi,l.ket].join(' ').toLowerCase().includes(q));
$('#p_log').innerHTML=`<input class="ni" id="lq" placeholder="Cari nama, aplikasi, aksi" aria-label="Cari" value="${E(LQ)}" oninput="LQ=this.value;rLog();const e=$('#lq');e.focus();e.setSelectionRange(e.value.length,e.value.length)"><div class="sgs"><button class="bt" onclick="ldLog()">Muat ulang</button></div>`+(L.length?L.map(l=>`<div class="it"><div class="nm">${E(l.aksi)} <span class="pill">${E(l.app)}</span></div><div class="m">${E(l.ket||'')}</div><div class="m">${E(l.nama)} · ${fdt(l.ts)}</div></div>`).join(''):'<div class="em">Belum ada aktivitas.</div>')}
function rSet(){const t=localStorage.getItem('zui.sys.th')||'auto';let h=`<h3 class="hh">Akun</h3><div class="m">${E(ME.nama)} <span class="pill">${E(RL[ME.peran]||'-')}</span></div><div class="m">${E(USER?USER.email:'')}</div><div class="sgs" style="margin-top:8px"><button class="bt" onclick="logout()">Keluar</button></div><h3 class="hh">Tampilan</h3>`+chips(['Otomatis','Terang','Gelap'],['auto','light','dark'].indexOf(t),'th');
if(isAdm()){h+=`<h3 class="hh">Perusahaan</h3><input class="ni" id="sn" value="${E(CO.nama)}" maxlength="60" aria-label="Nama perusahaan"><h3 class="hh">Logo</h3><p class="m">Tampil di semua aplikasi Zui. Gambar persegi atau transparan paling bagus; otomatis diperkecil.</p><div style="display:flex;align-items:center;gap:12px;margin:8px 0"><img id="lgp" alt="" style="width:56px;height:56px;object-fit:contain;border-radius:8px;border:1px solid var(--ln);${LG?'':'display:none'}" src="${LG?E(LG):''}"><label class="bt" style="cursor:pointer">Pilih gambar<input type="file" id="lgf" accept="image/*" style="display:none" onchange="pickLogo(this)"></label><button class="bt" id="lgx" onclick="clrLogo()" style="${LG?'':'display:none'}">Hapus logo</button></div><label class="ck" style="margin:14px 0 2px"><input type="checkbox" id="sal"${CO.alur!==false?' checked':''}> Wajib persetujuan dan serah-terima antar divisi</label><p class="m">Menyalakan alur: BoM disetujui, bahan diminta ke gudang, pembelian disetujui Admin dan dikonfirmasi Keuangan. Matikan jika tim kecil dan alur terasa berat.</p><h3 class="hh">Alamat aplikasi</h3><p class="m">Alamat lengkap tiap aplikasi (mis. https://namaanda.github.io/zui-inventori/). Dipakai di tab Aplikasi.</p>`+APPS.map(a=>`<label class="m">${E(a[1])}<input class="ni" data-a="${a[0]}" placeholder="https://" value="${E((CO.apps||{})[a[0]]||'')}" aria-label="Alamat ${E(a[1])}"></label>`).join('')+`<button class="go" style="margin-top:12px;padding:10px 16px;border-radius:8px" onclick="svCo()">Simpan</button>`}
$('#p_set').innerHTML=h}
function rAll(){rApp();rMem();rLog();rSet()}
/* ---------- data ---------- */
async function ldMem(){const snap=await coRef().collection('anggota').get();MEM=snap.docs.map(d=>Object.assign({id:d.id},d.data())).sort((a,b)=>(a.peran==='pemilik'?0:1)-(b.peran==='pemilik'?0:1)||(a.nama||'').localeCompare(b.nama||''))}
async function ldInv(){if(!isAdm()){INV=[];return}const s=await coRef().collection('undangan').get(),em=new Set(MEM.map(m=>(m.email||'').toLowerCase()));INV=[];for(const d of s.docs){if(em.has(d.id)){try{await d.ref.delete()}catch(e){}}else INV.push(Object.assign({id:d.id},d.data()))}}
async function ldTugas(){if(!CID||!FS)return;const r=ME.peran,me=ME.uid,A=r==='pemilik'||r==='admin',T=[],add=(app,t,n)=>{if(n>0)T.push({app,t,n})};
try{const c=coRef(),[b,p]=await Promise.all([c.collection('bom').get(),c.collection('produksi').orderBy('ts','desc').limit(300).get()]),B=b.docs.map(d=>d.data()),P=p.docs.map(d=>d.data());let po=[];
if(A||r==='keuangan'||r==='gudang'){try{const m=await c.collection('inv').doc('meta').get();if(m.exists){const n=m.data().n||0,cs=await Promise.all(Array.from({length:n},(_,i)=>c.collection('invc').doc(String(i)).get()));po=(JSON.parse(cs.map(x=>x.data().d).join('')).po)||[]}}catch(e){}}
const mine=x=>(x.pic||{}).uid===me;
if(A||r==='mutu')add('manufaktur','BoM menunggu persetujuan',B.filter(x=>x.st==='draf'&&(x.uid!==me||r==='pemilik')).length);
if(A||r==='mutu')add('manufaktur','Hasil produksi menunggu uji mutu',P.filter(x=>x.st==='mutu'||x.st==='tahan').length);
if(A||r==='gudang')add('inventori','Permintaan bahan menunggu diserahkan',P.filter(x=>x.st==='diminta').length);
if(A||r==='gudang')add('inventori','Hasil lulus mutu menunggu diterima gudang',P.filter(x=>x.st==='lulus'&&!x.ap).length);
if(A||r==='produksi'){add('manufaktur','Bahan sudah diserahkan, siap dimulai',P.filter(x=>x.st==='diserahkan'&&(mine(x)||A)).length);add('manufaktur','Produksi berjalan, menunggu diselesaikan',P.filter(x=>x.st==='berjalan'&&(mine(x)||A)).length);add('manufaktur','Permintaan bahan ditolak gudang',P.filter(x=>x.st==='rencana'&&x.tolak&&x.tolak.ket&&(mine(x)||A)).length);add('manufaktur','BoM ditolak',B.filter(x=>x.st==='ditolak'&&(x.uid===me||A)).length)}
if(A)add('inventori','Pembelian menunggu persetujuan',po.filter(x=>x.st==='draf'&&(x.bu!==me||r==='pemilik')).length);
if(A||r==='keuangan')add('inventori','Pembelian menunggu konfirmasi keuangan',po.filter(x=>x.st==='disetujui'&&(!x.ap1||x.ap1.u!==me||r==='pemilik'||x.ap1.auto)).length);
if(A||r==='gudang')add('inventori','Pembelian dikonfirmasi, menunggu barang diterima',po.filter(x=>x.st==='dipesan').length);
if(A){try{const k=await c.collection('cuti').where('st','==','menunggu').get();add('karyawan','Cuti menunggu persetujuan',k.docs.filter(d=>d.data().uid!==me||r==='pemilik').length)}catch(e){}}
if(A){try{const k=await c.collection('kas').where('st','==','menunggu').get();add('keuangan','Pengeluaran kas menunggu persetujuan',k.docs.filter(d=>d.data().uid!==me||r==='pemilik').length)}catch(e){}try{const k=await c.collection('cuti').where('st','==','menunggu').get();add('karyawan','Cuti menunggu persetujuan',k.docs.filter(d=>d.data().uid!==me||r==='pemilik').length)}catch(e){}}
TGS=T;TGL=true;rApp()}catch(e){TGL=true;TGS=[];rApp()}}
async function ldLog(){if(!canLog()){LOGS=[];rLog();return}try{const s=await coRef().collection('log').orderBy('ts','desc').limit(200).get();LOGS=s.docs.map(d=>d.data());rLog()}catch(e){toast(fbe(e))}}
async function tryInvite(u){const em=(u.email||'').toLowerCase();if(!em)return null;let iv;try{iv=await FS.collection('undangan').doc(em).get()}catch(e){return null}if(!iv.exists)return null;const d=iv.data(),cid=d.cid;
await FS.collection('perusahaan').doc(cid).collection('anggota').doc(u.uid).set({email:em,nama:d.nama||u.displayName||em,peran:d.peran,aktif:true,ts:Date.now()});
await FS.collection('profil').doc(u.uid).set({cid});try{await iv.ref.delete()}catch(e){}return cid}
async function boot(u){USER=u;ME={uid:u.uid,email:u.email||'',nama:u.displayName||u.email||'Pengguna',peran:''};CID=null;$('#nc').style.display='none';
let cid=null;try{const pr=await FS.collection('profil').doc(u.uid).get();cid=pr.exists?pr.data().cid:null;if(!cid)cid=await tryInvite(u)}catch(e){toast(fbe(e))}
if(!cid){$('#au').style.display='none';$('#nc').style.display='flex';return}
CID=cid;let mb=null,co=null;try{mb=await coRef().collection('anggota').doc(u.uid).get();co=await coRef().get()}catch(e){toast(fbe(e))}
if(!mb||!mb.exists||!co||!co.exists||mb.data().aktif!==true||!RL[mb.data().peran]){CID=null;$('#au').style.display='none';$('#nct').textContent='Akun Anda tidak aktif di perusahaan ini. Hubungi pemilik atau admin.';$('#nc').style.display='flex';return}
ME.peran=mb.data().peran;ME.nama=mb.data().nama||ME.nama;CO=Object.assign({nama:'',apps:{}},co.data());LG=CO.logo||'';
try{await ldMem();await ldInv()}catch(e){toast(fbe(e))}
$('#cn').textContent=CO.nama;setLogo();$('#au').style.display='none';rAll();ldLog();sync();ldTugas()}
async function mk(){const n=$('#cnm').value.trim();if(!n){$('#cnm').focus();return}if(!USER)return;const cid=uid();
try{await FS.collection('perusahaan').doc(cid).set({nama:n,owner:USER.uid,ts:Date.now(),apps:{}});
await FS.collection('perusahaan').doc(cid).collection('anggota').doc(USER.uid).set({email:(USER.email||'').toLowerCase(),nama:USER.displayName||USER.email,peran:'pemilik',aktif:true,ts:Date.now()});
await FS.collection('profil').doc(USER.uid).set({cid})}catch(e){toast(fbe(e));return}
await boot(USER);logw('Perusahaan dibuat',n)}
async function invite(){const em=$('#ie').value.trim().toLowerCase();if(!/^[^@\s]+@[^@\s]+\.[^@\s]+$/.test(em)){toast('Isi email yang valid');$('#ie').focus();return}
if(MEM.some(m=>(m.email||'').toLowerCase()===em)){toast('Email ini sudah menjadi anggota');return}
const p=$('#ip').value;if(!RS.includes(p))return;
try{const nm=$('#in').value.trim(),ts=Date.now();await coRef().collection('undangan').doc(em).set({peran:p,nama:nm,by:ME.uid,ts});await FS.collection('undangan').doc(em).set({cid:CID,peran:p,nama:nm,by:ME.uid,ts});await ldInv();rMem();toast('Undangan dibuat. Minta orangnya masuk dengan email itu.');logw('Undang anggota',em+' sebagai '+RL[p])}catch(e){toast(fbe(e))}}
async function cinv(em){if(DEL!==em){DEL=em;const b=document.getElementById('xi'+em);if(b)b.textContent='Yakin?';setTimeout(()=>{DEL=''},3000);return}DEL='';try{await FS.collection('undangan').doc(em).delete();await coRef().collection('undangan').doc(em).delete();await ldInv();rMem();logw('Batalkan undangan',em)}catch(e){toast(fbe(e))}}
async function spr(id,p){const m=MEM.find(x=>x.id===id);if(!m||!RS.includes(p)||m.peran==='pemilik'||id===ME.uid||!isAdm())return;try{await coRef().collection('anggota').doc(id).update({peran:p});m.peran=p;logw('Ubah peran',(m.nama||m.email)+' menjadi '+RL[p]);toast('Peran diubah')}catch(e){toast(fbe(e));rMem()}}
async function tgl(id){const m=MEM.find(x=>x.id===id);if(!m||m.peran==='pemilik'||id===ME.uid||!isAdm())return;try{await coRef().collection('anggota').doc(id).update({aktif:!m.aktif});m.aktif=!m.aktif;rMem();logw(m.aktif?'Aktifkan anggota':'Nonaktifkan anggota',m.nama||m.email)}catch(e){toast(fbe(e))}}
async function rm(id){const m0=MEM.find(x=>x.id===id);if(!m0||m0.peran==='pemilik'||id===ME.uid||!isAdm())return;if(DEL!==id){DEL=id;const b=document.getElementById('xm'+id);if(b)b.textContent='Yakin?';setTimeout(()=>{DEL=''},3000);return}DEL='';const m=MEM.find(x=>x.id===id);try{await coRef().collection('anggota').doc(id).delete();await ldMem();rMem();logw('Keluarkan anggota',m?(m.nama||m.email):id)}catch(e){toast(fbe(e))}}
let LG='';
const setLogo=()=>{const i=$('#lg');if(!i)return;const l=(CO&&CO.logo)||'';if(l&&/^data:image\//.test(l)){i.src=l;i.style.display=''}else{i.removeAttribute('src');i.style.display='none'}};
function lgUi(){const p=$('#lgp'),x=$('#lgx');if(p){if(LG){p.src=LG;p.style.display=''}else{p.removeAttribute('src');p.style.display='none'}}if(x)x.style.display=LG?'':'none'}
function clrLogo(){LG='';lgUi()}
function pickLogo(inp){const f=inp.files&&inp.files[0];inp.value='';if(!f)return;if(!/^image\//.test(f.type)){toast('File harus berupa gambar');return}
const r=new FileReader();r.onerror=()=>toast('Gambar tidak terbaca');r.onload=()=>{const im=new Image();im.onerror=()=>toast('Gambar tidak terbaca');im.onload=()=>{let out='';for(const mx of [256,192,128]){const k=Math.min(1,mx/Math.max(im.width,im.height)),w=Math.max(1,Math.round(im.width*k)),h=Math.max(1,Math.round(im.height*k)),c=document.createElement('canvas');c.width=w;c.height=h;c.getContext('2d').drawImage(im,0,0,w,h);for(const t of ['image/png','image/webp']){let u='';try{u=c.toDataURL(t,.85)}catch(e){}if(u&&u.startsWith('data:'+t)&&u.length<=70000){out=u;break}}if(out)break}
if(!out){toast('Gambar terlalu rumit, pakai gambar yang lebih sederhana');return}LG=out;lgUi();toast('Logo siap, tekan Simpan')};im.src=r.result};r.readAsDataURL(f)}
async function svCo(){const n=$('#sn').value.trim()||CO.nama,ap2={};document.querySelectorAll('#p_set [data-a]').forEach(e=>{const v=e.value.trim();if(v&&!okUrl(v)){ap2.bad=1}else if(v)ap2[e.dataset.a]=v});
if(ap2.bad){toast('Alamat aplikasi harus diawali http:// atau https://');return}
try{const al=$('#sal').checked;await coRef().update({nama:n,apps:ap2,logo:LG,alur:al});CO.nama=n;CO.apps=ap2;CO.logo=LG;CO.alur=al;ldTugas();setLogo();$('#cn').textContent=n;rApp();toast('Tersimpan');logw('Pengaturan perusahaan','diperbarui')}catch(e){toast(fbe(e))}}
/* ---------- login ---------- */
function amode(m){AM=m;$('#abt').textContent=m=='in'?'Masuk':'Daftar';$('#afg').style.display=m=='in'?'':'none';$('#ap').autocomplete=m=='in'?'current-password':'new-password';$('#ain').classList.toggle('on',m=='in');$('#aup').classList.toggle('on',m=='up');msg('')}
async function authGo(ev){ev.preventDefault();if(!FA){msg('Layanan login belum siap.',1);return false}const em=$('#ae').value.trim(),pw=$('#ap').value;$('#abt').disabled=true;
try{if(AM=='in'){const c=await FA.signInWithEmailAndPassword(em,pw);if(!c.user.emailVerified){await c.user.sendEmailVerification().catch(()=>{});await FA.signOut();msg('Email belum diverifikasi. Kami mengirim ulang tautan verifikasi ke email Anda.',1)}}
else{const c2=await FA.createUserWithEmailAndPassword(em,pw);await c2.user.sendEmailVerification();await FA.signOut();msg('Pendaftaran berhasil. Cek email Anda untuk verifikasi, lalu masuk.')}}
catch(e){msg(fbe(e),1)}$('#abt').disabled=false;return false}
async function authG(){if(!FA){msg('Layanan login belum siap.',1);return}const p=new firebase.auth.GoogleAuthProvider();
try{await FA.signInWithPopup(p)}catch(e){const c=e&&e.code;if(c=='auth/popup-blocked'||c=='auth/operation-not-supported-in-this-environment')FA.signInWithRedirect(p);else if(c!='auth/popup-closed-by-user'&&c!='auth/cancelled-popup-request')msg(fbe(e),1)}}
async function forgot(){const em=$('#ae').value.trim();if(!em){msg('Isi email dulu.',1);return}try{await FA.sendPasswordResetEmail(em);msg('Tautan reset dikirim ke email Anda.')}catch(e){msg(fbe(e),1)}}
async function logout(){await FA.signOut()}
const ldS=u=>new Promise((ok,no)=>{const s=document.createElement('script');s.src=u;s.onload=ok;s.onerror=no;document.head.appendChild(s)});
/* ---------- pivot ---------- */
const pv=$('#pv'),hd=$('#hd'),hdi=$('#hdi');hdi.innerHTML=N.map((n,i)=>`<button role="tab" onclick="go(${i})">${n}</button>`).join('');const bt=[...hdi.children];
function go(i){pv.scrollTo({left:i*pv.clientWidth,behavior:'smooth'})}
function fa(){}
function sync(){const w=pv.clientWidth||1,p=pv.scrollLeft/w,i=Math.max(0,Math.min(Math.floor(p),LN)),f=p-i,a=bt[i].offsetLeft,b=bt[Math.min(i+1,LN)].offsetLeft,mx=Math.max(0,hdi.offsetWidth-(hd.clientWidth-20));
hdi.style.transform='translateX('+(-Math.min(a+(b-a)*f,mx))+'px)';const k=Math.max(0,Math.min(Math.round(p),LN));bt.forEach((e,j)=>{e.classList.toggle('on',j===k);e.setAttribute('aria-selected',j===k)});cur=k}
pv.addEventListener('scroll',()=>requestAnimationFrame(sync));addEventListener('resize',sync);
ap();sync();$('#au').style.display='flex';
(async()=>{try{for(const f of ['app','auth','firestore'])await ldS('https://www.gstatic.com/firebasejs/10.12.2/firebase-'+f+'-compat.js')}catch(e){msg('Tidak dapat memuat layanan login. Periksa koneksi internet.',1);return}
firebase.initializeApp(CFG);FA=firebase.auth();FS=firebase.firestore();
FA.onAuthStateChanged(u=>{if(u&&u.emailVerified){if(!USER||USER.uid!==u.uid)setTimeout(()=>boot(u),0)}else if(!u){USER=null;CID=null;MEM=[];INV=[];LOGS=[];$('#nc').style.display='none';$('#au').style.display='flex'}})})();
if('serviceWorker' in navigator&&/^https?:/.test(location.protocol))navigator.serviceWorker.register('sw.js').catch(()=>{});
</script></body></html>
